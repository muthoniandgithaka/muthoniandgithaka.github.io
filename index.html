<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muthoni &amp; Githaka · Entry Pass</title>
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Muthoni &amp; Githaka - Your Wedding Entry Pass">
<meta property="og:description" content="Thursday, 7 January 2027. Tap to open your personal QR entry pass.">
<meta property="og:image" content="https://muthoniandgithaka.github.io/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FBF6EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --champagne:#F4E9D8; --paper:#FBF6EE; --blush:#F3E6DD;
    --sage:#8A9A7B; --sage-deep:#4E6450; --ink:#3A4A3D;
    --maroon:#6E1F2B; --gold:#B8975A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:'Cormorant Garamond',Georgia,serif;color:var(--ink);
       background:radial-gradient(120% 80% at 50% 0%,var(--paper) 0%,var(--blush) 100%);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:420px;margin:0 auto;padding:28px 18px 40px}
  .card{position:relative;background:var(--paper);border-radius:6px;padding:34px 26px 28px;
        box-shadow:0 1px 0 rgba(184,151,90,.35) inset,0 18px 40px -22px rgba(78,100,80,.45);
        overflow:hidden;text-align:center}
  .card:before{content:"";position:absolute;inset:9px;border:1px solid rgba(184,151,90,.55);border-radius:3px;pointer-events:none}
  .sprig{position:absolute;width:130px;opacity:.55;pointer-events:none;z-index:0}
  .card>*:not(.sprig){position:relative;z-index:1}
  .sprig.tr{top:-30px;right:-34px;transform:rotate(18deg)}
  .sprig.bl{bottom:-38px;left:-40px;transform:rotate(198deg)}
  .eyebrow{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.32em;color:var(--sage-deep)}
  .names{font-family:'Great Vibes',cursive;font-size:44px;line-height:1;color:var(--ink);margin:12px 0 4px}
  .names span{display:block}
  .names .n1{text-align:left;padding-left:8%}
  .names .n2{text-align:right;padding-right:8%}
  .names .amp{color:var(--gold);font-size:30px;margin:-6px 0}
  .date{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.22em;color:var(--maroon);margin-top:6px}
  .rule{display:flex;align-items:center;gap:10px;margin:18px auto;max-width:240px;color:var(--gold)}
  .rule:before,.rule:after{content:"";flex:1;height:1px;background:var(--gold);opacity:.7}
  .admit{display:inline-block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.28em;
         color:var(--paper);background:var(--maroon);padding:6px 14px 5px;border-radius:2px}
  .guest{font-size:26px;font-weight:600;margin-top:12px;line-height:1.15}
  .partner{font-size:19px;font-style:italic;color:var(--sage-deep)}
  .qrbox{margin:20px auto 10px;width:236px;padding:12px;background:var(--champagne);
         border:1px solid rgba(184,151,90,.7);border-radius:14px}
  .qrbox svg{display:block;width:100%;height:auto}
  .code{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.35em;color:var(--sage-deep);margin-top:6px}
  .note{font-size:15px;font-style:italic;color:var(--sage-deep);margin-top:4px}
  .venues{margin-top:20px;display:grid;gap:12px;text-align:left}
  .venue{border-left:2px solid var(--gold);padding:2px 0 2px 12px}
  .venue h4{font-family:'Cinzel',serif;font-weight:600;font-size:11px;letter-spacing:.24em;color:var(--maroon)}
  .venue p{font-size:17px;line-height:1.3}
  .venue a{color:var(--sage-deep);font-size:15px}
  .foot{font-size:14px;color:var(--sage-deep);margin:20px 0 14px;font-style:italic}
  /* usher */
  input,select,button{font:inherit;font-size:17px}
  .field{display:block;width:100%;padding:12px 14px;border:1px solid rgba(184,151,90,.7);border-radius:8px;background:#fff;margin-top:8px}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:8px;background:var(--sage-deep);color:var(--paper);
       font-family:'Cinzel',serif;letter-spacing:.18em;font-size:13px;margin-top:12px;cursor:pointer}
  .btn.alt{background:transparent;color:var(--sage-deep);border:1px solid var(--sage-deep)}
  .btn.small{display:inline-block;width:auto;padding:8px 14px;margin:0}
  .stats{display:flex;gap:10px;margin-top:16px}
  .stat{flex:1;background:var(--champagne);border-radius:8px;padding:10px}
  .stat b{display:block;font-size:26px;color:var(--maroon)}
  .stat span{font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.2em}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(184,151,90,.35);text-align:left}
  .row small{display:block;color:var(--sage-deep);font-style:italic}
  /* scan result (full screen) */
  .result{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
          text-align:center;padding:30px;color:#fff}
  .result.ok{background:var(--sage-deep)}
  .result.used{background:var(--maroon)}
  .result.warn{background:#8C6A2E}
  .result.bad{background:#2E2A27}
  .result .icon{width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
                display:flex;align-items:center;justify-content:center;font-size:64px;line-height:1}
  .result h1{font-family:'Cinzel',serif;font-size:28px;letter-spacing:.14em;margin-top:22px}
  .result .who{font-size:28px;font-weight:600;margin-top:14px}
  .result .sub{font-size:19px;font-style:italic;opacity:.9;margin-top:6px}
  .result .pill{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.2em;margin-top:16px;padding:7px 14px;border:1px solid rgba(255,255,255,.7);border-radius:20px}
  .result .btn{max-width:280px;background:rgba(255,255,255,.95);color:#2E2A27;margin-top:28px}
  .qrbox{cursor:zoom-in}
  .tap{font-size:13px;font-style:italic;color:var(--sage-deep);opacity:.8;margin-top:2px}
  .zoom{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px}
  .zoom svg{width:min(92vw,92vh);height:auto}
  .zoom p{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:14px;color:var(--sage-deep);margin-top:14px}
  .faqbtn{display:inline-block;margin-top:18px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;color:var(--sage-deep);border:1px solid var(--sage-deep);border-radius:22px;padding:10px 18px;text-decoration:none}
  .wrap.wide{max-width:680px}
  .dir{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
  .dir a{flex:1 1 200px;text-align:center;font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.12em;color:var(--paper);background:var(--sage-deep);border-radius:24px;padding:13px 14px;text-decoration:none}
  .faq{text-align:left;margin-top:8px}
  .faq details{border-bottom:1px solid rgba(184,151,90,.4);padding:16px 2px}
  .faq summary{cursor:pointer;font-weight:600;font-size:22px;list-style:none;display:flex;justify-content:space-between;gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary:after{content:'+';color:var(--gold);font-size:22px;line-height:1}
  .faq details[open] summary:after{content:'–'}
  .faq p{font-size:20px;line-height:1.5;margin-top:8px;white-space:pre-line}
  .faq mark{background:#F6E3B8;color:var(--maroon);padding:0 3px;border-radius:2px}
  .hidden{display:none!important}
  .muted{color:var(--sage-deep);font-style:italic}
</style>
</head>
<body>

<!-- eucalyptus sprig, reused as decoration -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="sprig">
      <path d="M8 140 C40 110 70 80 140 10" fill="none" stroke="#7E8F72" stroke-width="1.6"/>
      <g fill="#8A9A7B" fill-opacity=".85">
        <ellipse cx="30" cy="112" rx="13" ry="7" transform="rotate(-70 30 112)"/>
        <ellipse cx="44" cy="116" rx="12" ry="6.5" transform="rotate(20 44 116)"/>
        <ellipse cx="52" cy="88" rx="14" ry="7.5" transform="rotate(-75 52 88)"/>
        <ellipse cx="68" cy="94" rx="13" ry="7" transform="rotate(15 68 94)"/>
        <ellipse cx="78" cy="62" rx="13" ry="7" transform="rotate(-80 78 62)"/>
        <ellipse cx="94" cy="68" rx="12" ry="6.5" transform="rotate(10 94 68)"/>
        <ellipse cx="104" cy="38" rx="11" ry="6" transform="rotate(-82 104 38)"/>
        <ellipse cx="118" cy="42" rx="10" ry="5.5" transform="rotate(5 118 42)"/>
      </g>
      <g fill="#A9B79B" fill-opacity=".7">
        <ellipse cx="128" cy="20" rx="8" ry="4.5" transform="rotate(-40 128 20)"/>
        <ellipse cx="20" cy="128" rx="9" ry="5" transform="rotate(30 20 128)"/>
      </g>
    </g>
  </defs>
</svg>

<div id="app"></div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbwzjEuFCez_6jHkjy-BJVMB3j2So7_upr0R5vMWgLk2yzT_Exju8S4Ua8aaN7pgzeFj/exec';
  var SITE = location.origin + '/';
  var qs = new URLSearchParams(location.search);
  var CODE = (qs.get('g') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var MODE = qs.get('usher') ? 'usher' : (qs.get('faq') ? 'faq' : (CODE ? 'pass' : 'home'));
  var GUEST = null, CFG = null;
  var PASS_URL = CODE ? SITE + '?g=' + CODE : '';
  function api(params){
    return fetch(API + '?' + new URLSearchParams(params).toString(), {redirect:'follow'})
      .then(function(r){ return r.json(); });
  }

  var app = document.getElementById('app');
  var memory = {};                                   // fallback if storage is blocked
  function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ if(v===undefined) return memory[k]||null; memory[k]=v; } }
  function forget(k){ try{localStorage.removeItem(k);}catch(e){} delete memory[k]; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function sprig(cls){ return '<svg class="sprig '+cls+'" viewBox="0 0 150 150"><use href="#sprig"/></svg>'; }
  function run(fn){ var a=[].slice.call(arguments,1);
    if (fn==='admit') return api({api:'admit', g:a[0]||'', pin:a[1]||'', gate:a[2]||''});
    if (fn==='stats') return api({api:'stats', pin:a[0]||''});
    if (fn==='searchGuests') return api({api:'search', q:a[0]||'', pin:a[1]||''});
    return Promise.reject(new Error('Unknown action'));
  }

  /* ---------- themed QR (champagne ground, sage modules, maroon eyes) ---------- */
  function qrSvg(text){
    if (typeof qrcode !== 'function') return '<p class="muted">QR unavailable — show code '+esc(CODE)+'</p>';
    var qr = qrcode(0, 'Q'); qr.addData(text); qr.make();
    var n = qr.getModuleCount(), q = 3, size = n + q*2, s = '';
    function inEye(r,c){ return (r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7); }
    for (var r=0;r<n;r++) for (var c=0;c<n;c++){
      if (!qr.isDark(r,c) || inEye(r,c)) continue;
      s += '<rect x="'+(c+q)+'" y="'+(r+q)+'" width="1.02" height="1.02" rx="0.14"/>';
    }
    function eye(x,y){ x+=q; y+=q;
      return '<rect x="'+(x+0.5)+'" y="'+(y+0.5)+'" width="6" height="6" rx="0.9" fill="none" stroke="#6E1F2B" stroke-width="1"/>'+
             '<rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" rx="0.8" fill="#6E1F2B"/>'; }
    return '<svg viewBox="0 0 '+size+' '+size+'" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">'+
      '<rect width="'+size+'" height="'+size+'" fill="#FBF6EE" rx="1.5"/>'+
      '<g fill="#3F5643">'+s+'</g>'+eye(0,0)+eye(n-7,0)+eye(0,n-7)+'</svg>';
  }

  function venueBlock(label, v){
    return '<div class="venue"><h4>'+label+' · '+esc(v.time)+'</h4><p>'+esc(v.venue)+'<br><span class="muted">'+esc(v.address)+'</span></p>'+
      (v.mapLink ? '<a href="'+esc(v.mapLink)+'" target="_blank">Open in Maps →</a>' : '')+'</div>';
  }
  function header(){
    var parts = CFG.couple.split('&');
    return '<div class="eyebrow">TOGETHER WITH THEIR FAMILIES</div>'+
      '<div class="names"><span class="n1">'+esc(parts[0].trim())+'</span><span class="amp">&amp;</span><span class="n2">'+esc((parts[1]||'').trim())+'</span></div>'+
      '<div class="date">'+esc(CFG.date.toUpperCase())+'</div>';
  }

  /* ---------- guest pass ---------- */
  function renderPass(){
    if (!GUEST){ return renderMessage('This pass link isn\'t valid','Please check the link in your SMS, or contact the couple.'); }
    var ev = (GUEST.event||'Both').toLowerCase();
    var showC = ev.indexOf('reception')<0 || ev.indexOf('both')>=0;
    var showR = ev.indexOf('ceremony')<0 || ev.indexOf('both')>=0;
    app.innerHTML = '<div class="wrap"><div class="card">'+sprig('tr')+sprig('bl')+header()+
      '<div class="rule">✦</div>'+
      '<span class="admit">ADMIT '+GUEST.admits+'</span>'+
      '<div class="guest">'+esc(GUEST.guest)+'</div>'+
      (GUEST.partner ? '<div class="partner">&amp; '+esc(GUEST.partner)+'</div>' : '')+
      '<div class="qrbox" id="qr" role="button" aria-label="Enlarge QR code">'+qrSvg(PASS_URL)+'</div><div class="tap">Tap the code to enlarge it</div>'+
      '<div class="code">'+esc(CODE)+'</div>'+
      '<div class="note">Show this code at the entrance · valid for one entry</div>'+
      '<div class="venues">'+(CFG.split ? (showC?venueBlock('CEREMONY',CFG.ceremony):'')+(showR?venueBlock('RECEPTION',CFG.reception):'') : venueBlock('VENUE',CFG.venue))+'</div>'+
      '<a class="faqbtn" href="'+esc(CFG.url)+'?faq=1&g='+esc(CODE)+'">GUEST INFO &amp; FAQ →</a>'+
      '<div class="foot">Please don\'t share this pass — once scanned it can\'t be used again.</div>'+
      '</div></div>';
    document.getElementById('qr').onclick = function(){
      var z = document.createElement('div'); z.className = 'zoom';
      z.innerHTML = qrSvg(PASS_URL) + '<p>'+esc(CODE)+'</p><p style="font-family:inherit;letter-spacing:0;font-style:italic">Tap anywhere to close</p>';
      z.onclick = function(){ z.remove(); };
      document.body.appendChild(z);
    };
  }

  function renderMessage(title, body){
    app.innerHTML = '<div class="wrap"><div class="card">'+sprig('tr')+header()+'<div class="rule">✦</div>'+
      '<div class="guest">'+esc(title)+'</div><p class="note" style="margin-top:10px">'+esc(body)+'</p></div></div>';
  }

  /* ---------- scan result (usher phone) ---------- */
  function renderResult(res){
    var g = res.guest || {}, who = g.guest ? esc(g.guest)+(g.partner?' <br><span style="font-weight:400;font-style:italic">&amp; '+esc(g.partner)+'</span>':'') : '';
    var map = {
      ADMITTED:    ['ok','✓','ADMITTED', 'Party of '+(g.admits||1)],
      ALREADY:     ['used','✕','ALREADY USED', 'This pass was scanned at '+esc(res.when)],
      WRONG_EVENT: ['warn','!','CHECK LIST', 'RSVP\'d for: '+esc(g.event)+' — please check with the coordinator'],
      INVALID:     ['bad','?','NOT RECOGNISED', 'This code is not on the guest list'],
      BAD_PIN:     ['bad','!','USHER PIN WRONG', 'Re-enter the usher PIN']
    }[res.status] || ['bad','!','ERROR', esc(res.message||'Try again')];
    try{ navigator.vibrate && navigator.vibrate(res.status==='ADMITTED'?120:[90,60,90,60,200]); }catch(e){}
    app.innerHTML = '<div class="result '+map[0]+'"><div class="icon">'+map[1]+'</div><h1>'+map[2]+'</h1>'+
      (who?'<div class="who">'+who+'</div>':'')+'<div class="sub">'+map[3]+'</div>'+
      (res.gate && CFG.gates.length>1?'<div class="pill">'+esc(res.gate.toUpperCase())+'</div>':'')+
      '<button class="btn" id="done">'+(res.status==='BAD_PIN'?'RE-ENTER PIN':'OPEN USHER PANEL')+'</button></div>';
    document.getElementById('done').onclick = function(){
      if (res.status==='BAD_PIN') forget('mg_pin');
      renderUsher();
    };
  }

  function scanAsUsher(){
    app.innerHTML = '<div class="result bad"><div class="icon" style="font-size:30px">…</div><h1>CHECKING</h1></div>';
    run('admit', CODE, store('mg_pin'), store('mg_gate') || CFG.gates[0])
      .then(renderResult)
      .catch(function(e){ renderResult({status:'ERROR', message:e && e.message}); });
  }

  /* ---------- usher panel ---------- */
  function renderUsher(){
    var pin = store('mg_pin');
    if (!pin){
      app.innerHTML = '<div class="wrap"><div class="card">'+sprig('tr')+header()+'<div class="rule">✦</div>'+
        '<span class="admit">USHER SET-UP</span>'+
        '<p class="note" style="margin-top:12px">Enter the usher PIN once. After that, scanning a guest\'s QR with this phone\'s camera admits them.</p>'+
        '<input class="field" id="pin" type="password" inputmode="numeric" placeholder="Usher PIN">'+
        (CFG.gates.length>1 ? '<select class="field" id="gate">'+CFG.gates.map(function(g){return '<option>'+esc(g)+'</option>';}).join('')+'</select>' : '')+
        '<button class="btn" id="save">START CHECK-IN</button><p id="err" class="note" style="color:#6E1F2B"></p></div></div>';
      document.getElementById('save').onclick = function(){
        var p = document.getElementById('pin').value.trim(), gs = document.getElementById('gate');
        run('stats', p).then(function(s){
          if (s.status!=='OK'){ document.getElementById('err').textContent='That PIN is not right.'; return; }
          store('mg_pin', p); if (gs) store('mg_gate', gs.value);
          if (MODE==='pass') scanAsUsher(); else renderUsher();
        });
      };
      return;
    }
    var gate = store('mg_gate') || CFG.gates[0];
    app.innerHTML = '<div class="wrap"><div class="card">'+sprig('tr')+header()+'<div class="rule">✦</div>'+
      '<span class="admit">USHER · '+esc(gate.toUpperCase())+'</span>'+
      '<div class="stats" id="stats"><div class="stat"><b>–</b><span>ADMITTED</span></div><div class="stat"><b>–</b><span>EXPECTED</span></div></div>'+
      '<p class="note" style="margin-top:14px">Scan guest QR codes with this phone\'s camera app. No QR? Find the guest by name:</p>'+
      '<input class="field" id="q" placeholder="Search guest name…">'+
      '<div id="list"></div>'+
      '<button class="btn alt" id="out" style="margin-top:22px">SIGN OUT OF USHER MODE</button></div></div>';
    run('stats', store('mg_pin')).then(function(s){
      if (s.status!=='OK') return;
      var gs = s.gates[gate] || {people:0};
      document.getElementById('stats').innerHTML =
        '<div class="stat"><b>'+gs.people+'</b><span>ADMITTED</span></div><div class="stat"><b>'+s.people+'</b><span>EXPECTED</span></div>';
    });
    var t; document.getElementById('q').oninput = function(e){
      clearTimeout(t); var v = e.target.value; t = setTimeout(function(){ search(v); }, 300); };
    document.getElementById('out').onclick = function(){ forget('mg_pin'); forget('mg_gate'); renderUsher(); };
  }

  function search(q){
    run('searchGuests', q, store('mg_pin')).then(function(res){
      var gate = store('mg_gate') || CFG.gates[0];
      document.getElementById('list').innerHTML = (res.results||[]).map(function(g){
        var a = (g.admitted||[]).filter(function(x){return x.gate===gate;})[0];
        return '<div class="row"><div><b>'+esc(g.guest)+'</b>'+(g.partner?' &amp; '+esc(g.partner):'')+
          '<small>Admit '+g.admits+' · '+esc(g.event)+(a&&a.when?' · in at '+esc(a.when):'')+'</small></div>'+
          (a&&a.when ? '<span class="muted">✓ In</span>' : '<button class="btn small" data-code="'+esc(g.code)+'">ADMIT</button>')+'</div>';
      }).join('') || (q.length>1?'<p class="note" style="margin-top:10px">No match.</p>':'');
      [].forEach.call(document.querySelectorAll('[data-code]'), function(b){
        b.onclick = function(){ CODE = b.getAttribute('data-code'); scanAsUsher(); };
      });
    });
  }

  /* ---------- guest FAQ ---------- */
  function renderFaq(){
    function fmt(s){ return esc(s).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>'); }
    function mapBtn(label,v){ return v.mapLink ? '<a href="'+esc(v.mapLink)+'" target="_blank" rel="noopener">'+label+' · '+esc(v.venue)+' →</a>' : ''; }
    var dirs = CFG.split ? mapBtn('CEREMONY',CFG.ceremony)+mapBtn('RECEPTION',CFG.reception) : mapBtn('VENUE',CFG.venue);
    app.innerHTML = '<div class="wrap wide"><div class="card">'+sprig('tr')+sprig('bl')+header()+'<div class="rule">✦</div>'+
      '<span class="admit">GUEST INFO &amp; FAQ</span>'+
      (dirs ? '<div class="dir">'+dirs+'</div>' : '')+
      '<div class="faq">'+(CFG.faq||[]).map(function(f,i){
        return '<details'+(i===0?' open':'')+'><summary>'+esc(f.q)+'</summary><p>'+fmt(f.a)+'</p></details>'; }).join('')+'</div>'+
      (CODE ? '<a class="faqbtn" href="'+esc(CFG.url)+'?g='+esc(CODE)+'">← BACK TO MY PASS</a>' : '')+
      '<div class="foot">We can\'t wait to celebrate with you.</div></div></div>';
  }

  /* ---------- route ---------- */
  function route(){
    if (MODE==='faq') renderFaq();
    else if (MODE==='usher') renderUsher();
    else if (MODE==='pass') { if (store('mg_pin')) scanAsUsher(); else renderPass(); }
    else renderMessage('Welcome', 'Open the personal pass link from your SMS to see your entry QR code.');
  }
  app.innerHTML = '<div class="wrap"><div class="card" style="padding:60px 26px"><div class="eyebrow">MUTHONI &amp; GITHAKA</div><p class="note" style="margin-top:14px">Opening your pass…</p></div></div>';
  api({api:'pass', g:CODE}).then(function(d){
    CFG = d.cfg; CFG.url = SITE; GUEST = d.guest; route();
  }).catch(function(){
    app.innerHTML = '<div class="wrap"><div class="card" style="padding:60px 26px"><div class="eyebrow">MUTHONI &amp; GITHAKA</div><p class="note" style="margin-top:14px">We couldn\'t load this page. Please check your connection and refresh.</p></div></div>';
  });
</script>
</body>
</html>
